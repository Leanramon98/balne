schema: spec-driven

context: |
  Project: project-base (Auto-Insight DTI monorepo).
  Frontend: Next.js 15 App Router, React 19, TypeScript, Tailwind CSS 4, shadcn/ui, and SWR.
  Backend: Go Echo API gateway and Go microservices using hexagonal architecture.
  Data and messaging: PostgreSQL 16 with schema-per-service and RabbitMQ.
  Request flow: Browser -> Next.js BFF -> API gateway -> Go services.
  Conventions: API access through frontend sdk/api; backend endpoints are implemented backend-first; generated files are never edited manually.

strict_tdd: true

testing:
  detected: "2026-07-17"
  strict_tdd: true
  rationale: "No explicit Strict TDD marker existed; test runners are available, so Strict TDD defaults to enabled."
  runners:
    - layer: unit
      framework: "Go testing"
      commands:
        - "cd workspace/services/evaluations-service && go test ./..."
        - "cd workspace/services/users-service && go test ./..."
        - "cd workspace/gateways/api-gateway && go test ./..."
    - layer: integration
      framework: "Go testing, httptest, and Testcontainers"
      commands:
        - "cd workspace/services/users-service && go test -tags=e2e ./internal/e2e"
      prerequisites:
        - "Docker daemon"
    - layer: e2e
      framework: "Playwright"
      commands:
        - "cd workspace/frontend && npm run test:e2e"
      prerequisites:
        - "Running application at BASE_URL or http://localhost"
  coverage:
    available: true
    commands:
      - "cd workspace/services/evaluations-service && go test -cover ./..."
      - "cd workspace/services/users-service && go test -cover ./..."
      - "cd workspace/gateways/api-gateway && go test -cover ./..."
    threshold: 0
  quality:
    linter:
      available: true
      commands:
        - "cd workspace/frontend && npm run lint"
        - "cd workspace/services/evaluations-service && go vet ./..."
        - "cd workspace/services/users-service && go vet ./..."
        - "cd workspace/gateways/api-gateway && go vet ./..."
    type_checker:
      available: true
      commands:
        - "cd workspace/frontend && npx tsc --noEmit"
        - "Go type checking is enforced by go test and go vet in each Go module."
    formatter:
      available: true
      commands:
        - "gofmt -l workspace/services workspace/gateways"
      limitations:
        - "No project-level JavaScript or TypeScript formatter configuration was detected."

workflow:
  execution_mode: interactive
  artifact_store: hybrid
  chained_pr_strategy: ask-always
  review_budget_lines: 400

rules:
  proposal:
    - "State intent, scope, dependencies, risks, and rollback considerations."
    - "Keep product changes out of the initialization phase."
  specs:
    - "Use RFC 2119 keywords for normative requirements."
    - "Express acceptance scenarios with Given, When, and Then."
  design:
    - "Follow existing hexagonal, BFF, SDK, and Atomic Design boundaries."
    - "Document consequential decisions and their rationale."
  tasks:
    - "Use hierarchical numbering and keep tasks independently verifiable."
    - "Plan reviewable work units within the 400-line review budget."
  apply:
    guidelines:
      - "Use RED-GREEN-REFACTOR for behavior changes."
      - "Never edit generated files manually."
      - "Preserve unrelated working-tree changes."
    tdd: true
    test_command: "Run the affected module command from testing.runners."
  verify:
    test_command: "Run affected unit and integration commands, plus Playwright when user-facing workflows change."
    build_command: "cd workspace/frontend && npm run build"
    coverage_threshold: 0
  archive:
    - "Warn before merging destructive deltas."
    - "Never modify archived change artifacts."
