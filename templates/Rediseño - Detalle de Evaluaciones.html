  <script>
    
document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2563eb&quot;,&quot;#0f766e&quot;,&quot;#7c3aed&quot;,&quot;#db2777&quot;],&quot;section&quot;:&quot;Apariencia&quot;}}\">\nclass Component extends DCLogic {\n  state = { tab: 'info', estadoIdx: 4, estadoMenuOpen: false, accesoMenuRow: null, niveles: null };\n\n  setTab = (t) => this.setState({ tab: t, estadoMenuOpen: false, accesoMenuRow: null });\n  toggleEstadoMenu = () => this.setState(s => ({ estadoMenuOpen: !s.estadoMenuOpen, accesoMenuRow: null }));\n  setEstado = (i) => this.setState({ estadoIdx: i, estadoMenuOpen: false });\n  toggleAccesoMenu = (i) => this.setState(s => ({ accesoMenuRow: s.accesoMenuRow === i ? null : i, estadoMenuOpen: false }));\n  setNivel = (row, val) => this.setState(s => {\n    const n = (s.niveles || this.defaultNiveles()).slice();\n    n[row] = val;\n    return { niveles: n, accesoMenuRow: null };\n  });\n  closeMenus = () => this.setState({ estadoMenuOpen: false, accesoMenuRow: null });\n\n  defaultNiveles() { return ['Administración', 'Evaluador', 'Carga', 'Solo lectura', 'Carga', 'Solo lectura']; }\n\n  renderVals() {\n    const accent = this.props.accentColor || '#2563eb';\n    const accentSoft = `color-mix(in srgb, ${accent} 12%, #ffffff)`;\n\n    const destino = { name: 'Ciudad de Buenos Aires' };\n    const user = { name: 'María Sánchez', role: 'Administradora', initials: 'MS' };\n    const evalData = { nombre: 'Autodiagnóstico 2025', tipo: 'Autodiagnóstico', periodo: '31/1/2025 – 29/10/2025' };\n\n    // ---- nav ----\n    const base = 'display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;';\n    const idle = (muted) => base + `font-weight:500;color:${muted ? '#71717a' : '#3f3f46'};background:transparent;`;\n    const activeStyle = base + `font-weight:600;color:${accent};background:${accentSoft};`;\n    const nav = {\n      destino: idle(), evaluacionesActive: activeStyle, ambitos: idle(), indicadores: idle(),\n      acciones: idle(), plan: idle(), resultados: idle(), informes: idle(), config: idle(true),\n    };\n\n    // ---- estados / stepper ----\n    const estadoMeta = {\n      'Borrador': { bg: '#f4f4f5', fg: '#52525b', dot: '#a1a1aa' },\n      'En curso': { bg: '#dbeafe', fg: '#1d4ed8', dot: '#2563eb' },\n      'Carga finalizada': { bg: '#fef9c3', fg: '#854d0e', dot: '#ca8a04' },\n      'En evaluación': { bg: '#fef9c3', fg: '#854d0e', dot: '#ca8a04' },\n      'Cerrada': { bg: '#dcfce7', fg: '#166534', dot: '#16a34a' },\n    };\n    const estados = ['Borrador', 'En curso', 'Carga finalizada', 'En evaluación', 'Cerrada'];\n    const idx = this.state.estadoIdx;\n    const estadoActual = estados[idx];\n    const em = estadoMeta[estadoActual];\n    const estadoBadgeStyle = `display:inline-flex;align-items:center;padding:4px 12px;border-radius:9999px;font-size:12.5px;font-weight:600;background:${em.bg};color:${em.fg};`;\n    const estadoDotColor = em.dot;\n\n    const estadoMenu = estados.map((label, i) => {\n      const done = i < idx, current = i === idx, isNext = i === idx + 1;\n      const rowStyle = 'display:flex;align-items:center;gap:11px;padding:9px 10px;border-radius:8px;cursor:pointer;' + (current ? 'background:#f4f4f5;' : '');\n      const iconStyle = 'display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;flex-shrink:0;' + (\n        done ? `background:${estadoMeta[label].bg};color:${estadoMeta[label].fg};`\n        : current ? `background:${accent};color:#fff;`\n        : 'background:#fff;border:1.5px solid #e4e4e7;color:#a1a1aa;');\n      return {\n        label, done, current, isNext, rowStyle, iconStyle,\n        weight: current ? '600' : '500', color: i <= idx ? '#18181b' : '#52525b',\n        onClick: () => this.setEstado(i),\n      };\n    });\n\n    const stepper = estados.map((label, i) => {\n      const done = i < idx, current = i === idx;\n      const nodeStyle = 'display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0;' + (\n        done ? `background:${accent};color:#fff;`\n        : current ? `background:#fff;border:2px solid ${accent};color:${accent};`\n        : 'background:#f1f1f3;color:#a1a1aa;');\n      const labelStyle = `font-size:13px;font-weight:${current ? '700' : '500'};color:${i <= idx ? '#18181b' : '#a1a1aa'};white-space:nowrap;`;\n      return {\n        n: String(i + 1), label, done, current, showNum: !done, nodeStyle, labelStyle,\n        line: i < estados.length - 1, flex: i < estados.length - 1 ? '1' : '0',\n        lineColor: i < idx ? accent : '#e4e4e7',\n      };\n    });\n\n    // ---- tabs ----\n    const tabDefs = [['info', 'Información'], ['ambitos', 'Ámbitos'], ['accesos', 'Accesos']];\n    const tabs = tabDefs.map(([k, label]) => {\n      const on = this.state.tab === k;\n      return {\n        label,\n        style: on\n          ? 'padding:8px 18px;border-radius:7px;font-size:14px;font-weight:600;color:#18181b;background:#fff;box-shadow:0 1px 3px rgba(24,24,27,.1);cursor:pointer;'\n          : 'padding:8px 18px;border-radius:7px;font-size:14px;font-weight:500;color:#71717a;background:transparent;cursor:pointer;',\n        onClick: () => this.setTab(k),\n      };\n    });\n\n    // ---- detalles (info) ----\n    const cellBase = 'display:flex;flex-direction:column;gap:6px;padding:16px 22px;border-bottom:1px solid #f4f4f5;';\n    const detallesRaw = [\n      { label: 'Destino', value: destino.name },\n      { label: 'Tipo', value: evalData.tipo },\n      { label: 'Estado', value: estadoActual },\n      { label: 'Fecha desde', value: '31/1/2025' },\n      { label: 'Fecha hasta', value: '29/10/2025' },\n      { label: 'Evaluador externo', value: 'No' },\n      { label: 'Creada por', value: 'María Sánchez', isUser: true, initials: 'MS' },\n      { label: 'Creada', value: '26/6/2026' },\n    ];\n    const detalles = detallesRaw.map((d, i) => ({\n      ...d,\n      isUser: !!d.isUser,\n      cellStyle: cellBase + (i % 2 === 0 ? 'border-right:1px solid #f4f4f5;' : ''),\n    }));\n\n    // ---- ámbitos ----\n    const ejeMeta = {\n      GOB: { label: 'Gobernanza · GOB', c: '#2563eb' },\n      INN: { label: 'Innovación · INN', c: '#7c3aed' },\n      TEC: { label: 'Tecnología · TEC', c: '#0891b2' },\n      SOST: { label: 'Sostenibilidad · SOST', c: '#16a34a' },\n      ACC: { label: 'Accesibilidad · ACC', c: '#ea580c' },\n    };\n    const ambitosRaw = [\n      ['ORG', 'Organización', 'GOB', 10], ['FIN', 'Financiación', 'GOB', 7], ['PLA', 'Planificación', 'GOB', 5], ['GEST', 'Gestión', 'GOB', 5],\n      ['ECO', 'Ecosistema', 'INN', 6], ['DAT', 'Datos', 'INN', 6], ['EXP', 'Experiencia', 'INN', 4],\n      ['INF', 'Infraestructura', 'TEC', 5], ['CON', 'Conectividad', 'TEC', 6], ['SEN', 'Sensorización', 'TEC', 3], ['PLAT', 'Plataforma', 'TEC', 6],\n      ['MED', 'Medio Ambiente', 'SOST', 7], ['SOC', 'Social', 'SOST', 6], ['ECON', 'Económica', 'SOST', 6],\n      ['ACC_FIS', 'Accesibilidad Física', 'ACC', 8], ['ACC_DIG', 'Accesibilidad Digital', 'ACC', 4],\n    ];\n    const ambitos = ambitosRaw.map(([code, name, eje, n]) => {\n      const meta = ejeMeta[eje];\n      return {\n        code, name: `${code} — ${name}`, eje: meta.label, count: `${n}/${n}`, pct: '100%',\n        pctColor: '#16a34a',\n        iconStyle: `display:flex;align-items:center;justify-content:center;min-width:46px;height:34px;padding:0 8px;border-radius:8px;background:color-mix(in srgb, ${meta.c} 11%, #ffffff);color:${meta.c};font-size:11px;font-weight:700;letter-spacing:.02em;flex-shrink:0;`,\n        barStyle: 'height:100%;width:100%;border-radius:9999px;background:#16a34a;',\n      };\n    });\n\n    // ---- accesos ----\n    const nivelMeta = {\n      'Solo lectura': { bg: '#f4f4f5', fg: '#52525b', dot: '#a1a1aa', hint: 'Ver resultados' },\n      'Carga': { bg: '#dbeafe', fg: '#1d4ed8', dot: '#2563eb', hint: 'Cargar valores del destino' },\n      'Evaluador': { bg: '#ede9fe', fg: '#6d28d9', dot: '#7c3aed', hint: 'Ajustar y verificar' },\n      'Administración': { bg: '#18181b', fg: '#ffffff', dot: '#18181b', hint: 'Control total' },\n    };\n    const nivelOrder = ['Solo lectura', 'Carga', 'Evaluador', 'Administración'];\n    const nivelLegend = nivelOrder.map(label => ({\n      label, hint: nivelMeta[label].hint,\n      dot: `width:9px;height:9px;border-radius:50%;background:${nivelMeta[label].dot};`,\n    }));\n\n    const usersRaw = [\n      { name: 'María Sánchez', email: 'maria.sanchez@dti.org', rol: 'Administradora', actividad: 'Hace 2 h', bg: accentSoft, fg: accent, initials: 'MS' },\n      { name: 'Javier Pérez', email: 'j.perez@auditext.com', rol: 'Evaluador externo', actividad: 'Ayer', bg: '#ede9fe', fg: '#6d28d9', initials: 'JP' },\n      { name: 'Lucía Gómez', email: 'lucia.gomez@baires.gob.ar', rol: 'Equipo destino', actividad: 'Hace 3 d', bg: '#dbeafe', fg: '#1d4ed8', initials: 'LG' },\n      { name: 'Carlos Ruiz', email: 'c.ruiz@dti.org', rol: 'Analista', actividad: 'Hace 1 sem', bg: '#fef9c3', fg: '#854d0e', initials: 'CR' },\n      { name: 'Sofía Díaz', email: 'sofia.diaz@baires.gob.ar', rol: 'Equipo destino', actividad: 'Hace 4 d', bg: '#dcfce7', fg: '#166534', initials: 'SD' },\n      { name: 'Dir. de Turismo', email: 'turismo@baires.gob.ar', rol: 'Observador', actividad: 'Hace 2 sem', bg: '#f4f4f5', fg: '#52525b', initials: 'DT' },\n    ];\n    const niveles = this.state.niveles || this.defaultNiveles();\n    const accesos = usersRaw.map((u, i) => {\n      const nivel = niveles[i];\n      const nm = nivelMeta[nivel];\n      const options = nivelOrder.map(label => ({\n        label, hint: nivelMeta[label].hint, dot: nivelMeta[label].dot,\n        selected: label === nivel, onClick: () => this.setNivel(i, label),\n      }));\n      return {\n        name: u.name, email: u.email, rol: u.rol, actividad: u.actividad,\n        initials: u.initials, avatarBg: u.bg, avatarFg: u.fg,\n        nivel, nivelDot: nm.dot,\n        nivelStyle: `display:inline-flex;align-items:center;gap:7px;padding:4px 10px 4px 11px;border-radius:9999px;font-size:12.5px;font-weight:600;background:${nm.bg};color:${nm.fg};cursor:pointer;border:1px solid ${nivel === 'Administración' ? '#18181b' : 'transparent'};`,\n        menuOpen: this.state.accesoMenuRow === i,\n        toggleMenu: () => this.toggleAccesoMenu(i),\n        options,\n      };\n    });\n\n    return {\n      accent, accentSoft, destino, user, eval: evalData,\n      nav,\n      estadoActual, estadoBadgeStyle, estadoDotColor,\n      estadoMenu, estadoMenuOpen: this.state.estadoMenuOpen, toggleEstadoMenu: this.toggleEstadoMenu,\n      stepper, tabs,\n      isInfo: this.state.tab === 'info', isAmbitos: this.state.tab === 'ambitos', isAccesos: this.state.tab === 'accesos',\n      goAmbitos: () => this.setTab('ambitos'), goAccesos: () => this.setTab('accesos'),\n      detalles, ambitos, accesos, nivelLegend,\n      anyMenuOpen: this.state.estadoMenuOpen || this.state.accesoMenuRow !== null,\n      closeMenus: this.closeMenus,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
