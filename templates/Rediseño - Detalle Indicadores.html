document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

,235,.12);\"><\u002Ftextarea>\n          <\u002Fdiv>\n          <div>\n            <label style=\"display:block;font-size:13px;font-weight:600;color:#3f3f46;margin-bottom:7px;\">Evidencia inicial<\u002Flabel>\n            <div style=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:22px;border:1px dashed #d4d4d8;border-radius:11px;background:#fafafa;cursor:pointer;\" style-hover=\"display:flex;flex-direction:column;align-items:center;justify-content:center;gap:7px;padding:22px;border:1px dashed #a1a1aa;border-radius:11px;background:#f4f4f5;cursor:pointer;\">\n              <svg width=\"22\" height=\"22\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a1a1aa\" stroke-width=\"1.8\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M12 3v12\"><\u002Fpath><path d=\"m17 8-5-5-5 5\"><\u002Fpath><path d=\"M20 21H4\"><\u002Fpath><\u002Fsvg>\n              <span style=\"font-size:13px;color:#71717a;\">Arrastrá un archivo o <span style=\"color:{{ accent }};font-weight:600;\">buscá en tu equipo<\u002Fspan><\u002Fspan>\n              <span style=\"font-size:11.5px;color:#a1a1aa;\">PDF, imagen o enlace · opcional<\u002Fspan>\n            <\u002Fdiv>\n          <\u002Fdiv>\n        <\u002Fdiv>\n        <div style=\"display:flex;align-items:center;justify-content:flex-end;gap:10px;padding:16px 24px;border-top:1px solid #f1f1f3;background:#fafafa;\">\n          <button onclick=\"{{ closeCreate }}\" style=\"padding:10px 16px;background:#fff;color:#3f3f46;border:1px solid #e4e4e7;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;\" style-hover=\"padding:10px 16px;background:#f4f4f5;color:#18181b;border:1px solid #d4d4d8;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;\">Cancelar<\u002Fbutton>\n          <button onclick=\"{{ closeCreate }}\" style=\"display:flex;align-items:center;gap:8px;padding:10px 18px;background:#18181b;color:#fff;border:none;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;\" style-hover=\"display:flex;align-items:center;gap:8px;padding:10px 18px;background:#000;color:#fff;border:none;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;\"><svg width=\"15\" height=\"15\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"M12 5v14\"><\u002Fpath><\u002Fsvg>Crear y vincular<\u002Fbutton>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1280,&quot;height&quot;:1400},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2563eb&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2563eb&quot;,&quot;#0f766e&quot;,&quot;#7c3aed&quot;,&quot;#db2777&quot;],&quot;section&quot;:&quot;Apariencia&quot;}}\">\nclass Component extends DCLogic {\n  state = { editMode: false, linkOpen: false, createOpen: false, linkedIds: [1, 2] };\n\n  toggleEdit = () => this.setState(s => ({ editMode: !s.editMode }));\n  toggleLink = () => this.setState(s => ({ linkOpen: !s.linkOpen }));\n  openCreate = () => this.setState({ createOpen: true, linkOpen: false });\n  closeCreate = () => this.setState({ createOpen: false });\n  stop = (e) => { e.stopPropagation && e.stopPropagation(); };\n  linkAction = (id) => this.setState(s => ({ linkedIds: [...s.linkedIds, id] }));\n  unlinkAction = (id) => this.setState(s => ({ linkedIds: s.linkedIds.filter(x => x !== id) }));\n\n  renderVals() {\n    const accent = this.props.accentColor || '#2563eb';\n    const accentSoft = `color-mix(in srgb, ${accent} 11%, #ffffff)`;\n    const accentBorder = `color-mix(in srgb, ${accent} 28%, #ffffff)`;\n    const violet = '#7c3aed';\n\n    const destino = { name: 'Ciudad de Buenos Aires' };\n    const user = { name: 'María Sánchez', role: 'Administradora', initials: 'MS' };\n\n    // ---- nav ----\n    const base = 'display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;';\n    const idle = (m) => base + `font-weight:500;color:${m ? '#71717a' : '#3f3f46'};background:transparent;`;\n    const activeStyle = base + `font-weight:600;color:${accent};background:${accentSoft};`;\n    const nav = { destino: idle(), evaluaciones: idle(), ambitos: idle(), indicadoresActive: activeStyle, acciones: idle(), plan: idle(), resultados: idle(), informes: idle(), config: idle(true) };\n\n    const editMode = this.state.editMode;\n    const editBtnLabel = editMode ? 'Guardar cambios' : 'Editar';\n    const editBtnStyle = editMode\n      ? 'display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#18181b;color:#fff;border:none;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;'\n      : 'display:inline-flex;align-items:center;gap:8px;padding:8px 16px;background:#fff;color:#3f3f46;border:1px solid #e4e4e7;border-radius:9px;font-size:13.5px;font-weight:600;cursor:pointer;';\n\n    // ---- criterios (destino 92→100 bucket, evaluador 97→100) ----\n    const critRaw = [\n      { pct: '0%', label: 'No existe órgano de gestión', bg: '#fef2f2', bd: '#fecaca', fg: '#b91c1c', desc: '#dc2626' },\n      { pct: '25%', label: 'En fase de creación', bg: '#fff7ed', bd: '#fed7aa', fg: '#c2410c', desc: '#ea580c' },\n      { pct: '50%', label: 'Creado pero sin recursos asignados', bg: '#fefce8', bd: '#fde68a', fg: '#a16207', desc: '#ca8a04' },\n      { pct: '75%', label: 'Operativo con recursos parciales', bg: '#f7fee7', bd: '#d9f99d', fg: '#4d7c0f', desc: '#65a30d' },\n      { pct: '100%', label: 'Totalmente operativo y consolidado', bg: '#f0fdf4', bd: '#bbf7d0', fg: '#15803d', desc: '#16a34a' },\n    ];\n    const destinoIdx = 4, evalIdx = 4;\n    const criterios = critRaw.map((c, i) => {\n      const sel = i === destinoIdx || i === evalIdx;\n      return {\n        pct: c.pct, label: c.label, fg: c.fg, descColor: c.desc,\n        destino: i === destinoIdx, evaluador: i === evalIdx,\n        cardStyle: `border:1.5px solid ${sel ? c.fg : c.bd};border-radius:11px;padding:11px 12px;background:${c.bg};` + (sel ? `box-shadow:0 0 0 3px ${c.bg};` : 'opacity:.78;'),\n      };\n    });\n\n    // ---- acciones catalog ----\n    const estadoMeta = {\n      'Propuesta': { bg: '#f4f4f5', fg: '#52525b', dot: '#a1a1aa' },\n      'En curso': { bg: '#dbeafe', fg: '#1d4ed8', dot: '#2563eb' },\n      'Completada': { bg: '#dcfce7', fg: '#166534', dot: '#16a34a' },\n      'Validada': { bg: '#ede9fe', fg: '#6d28d9', dot: '#7c3aed' },\n    };\n    const evIcon = (type) => {\n      if (type === 'img') return { glyph: '🖼', svg: '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#0891b2\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"18\" x=\"3\" y=\"3\" rx=\"2\" ry=\"2\"><\u002Frect><circle cx=\"9\" cy=\"9\" r=\"2\"><\u002Fcircle><path d=\"m21 15-3.086-3.086a2 2 0 0 0-2.828 0L6 21\"><\u002Fpath><\u002Fsvg>', wrap: '#ecfeff', col: '#0891b2' };\n      if (type === 'link') return { wrap: '#eef2ff', col: '#4f46e5', svg: '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#4f46e5\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M10 13a5 5 0 0 0 7.54.54l3-3a5 5 0 0 0-7.07-7.07l-1.72 1.71\"><\u002Fpath><path d=\"M14 11a5 5 0 0 0-7.54-.54l-3 3a5 5 0 0 0 7.07 7.07l1.71-1.71\"><\u002Fpath><\u002Fsvg>' };\n      return { wrap: '#fef2f2', col: '#dc2626', svg: '<svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#dc2626\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M15 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V7Z\"><\u002Fpath><path d=\"M14 2v4a2 2 0 0 0 2 2h4\"><\u002Fpath><\u002Fsvg>' };\n    };\n    const catalog = {\n      1: { name: 'Creación del órgano gestor DTI', estado: 'Completada', tag: 'GOB · ORG', owner: 'Área de Gobernanza', ev: [{ name: 'Acta de constitución.pdf', meta: 'PDF · 240 KB', type: 'pdf' }, { name: 'Organigrama DTI.png', meta: 'Imagen · 1.1 MB', type: 'img' }] },\n      2: { name: 'Asignación de presupuesto al equipo DTI', estado: 'En curso', tag: 'GOB · FIN', owner: 'Dir. Financiera', ev: [{ name: 'Resolución presupuestaria 2025.pdf', meta: 'PDF · 180 KB', type: 'pdf' }] },\n      3: { name: 'Convenio marco público-privado', estado: 'Validada', tag: 'GOB · ORG', owner: 'Secretaría DTI', ev: [{ name: 'Convenio firmado.pdf', meta: 'PDF · 520 KB', type: 'pdf' }, { name: 'Portal del convenio', meta: 'Enlace', type: 'link' }] },\n      4: { name: 'Plan de formación del equipo DTI', estado: 'Propuesta', tag: 'GOB · ORG', owner: 'RR.HH.', ev: [] },\n      5: { name: 'Adhesión a Red DTI nacional', estado: 'En curso', tag: 'GOB · ORG', owner: 'Gabinete', ev: [{ name: 'Carta de adhesión.pdf', meta: 'PDF · 96 KB', type: 'pdf' }] },\n    };\n\n    const evCountLabel = (n) => n === 0 ? 'Sin evidencia' : (n === 1 ? '1 evidencia' : `${n} evidencias`);\n\n    const linkedIds = this.state.linkedIds;\n    const linked = linkedIds.map(id => {\n      const a = catalog[id]; const em = estadoMeta[a.estado];\n      return {\n        id, name: a.name, estado: a.estado, tag: a.tag, owner: a.owner,\n        estadoBadge: `display:inline-flex;align-items:center;gap:6px;padding:3px 11px;border-radius:9999px;font-size:11.5px;font-weight:600;background:${em.bg};color:${em.fg};`,\n        evLabel: evCountLabel(a.ev.length), hasEv: a.ev.length > 0, noEv: a.ev.length === 0,\n        evidencias: a.ev.map(e => {\n          const ic = evIcon(e.type);\n          return { name: e.name, meta: e.meta, iconColor: ic.col, iconWrap: `display:flex;align-items:center;justify-content:center;width:28px;height:28px;border-radius:7px;background:${ic.wrap};flex-shrink:0;` };\n        }),\n        onUnlink: () => this.unlinkAction(id),\n      };\n    });\n\n    const availableIds = [1, 2, 3, 4, 5].filter(id => !linkedIds.includes(id));\n    const available = availableIds.map(id => {\n      const a = catalog[id]; const em = estadoMeta[a.estado];\n      return {\n        name: a.name, estado: a.estado, tag: a.tag, evCount: evCountLabel(a.ev.length),\n        estadoDot: `width:9px;height:9px;border-radius:50%;background:${em.dot};flex-shrink:0;`,\n        onLink: () => this.linkAction(id),\n      };\n    });\n\n    // ---- historial ----\n    const historial = [\n      { who: 'Javier Pérez', what: 'verificó el valor del evaluador (97%).', when: '26/6/2026, 19:59', dot: '#16a34a', line: true },\n      { who: 'María Sánchez', what: 'vinculó la acción «Creación del órgano gestor DTI».', when: '24/6/2026, 11:02', dot: accent, line: true },\n      { who: 'María Sánchez', what: 'cargó el valor del destino (92%).', when: '20/6/2026, 09:14', dot: accent, line: false },\n    ];\n\n    // ---- mensajes ----\n    const evalAreaStyle = (editMode\n      ? 'width:100%;min-height:64px;padding:11px 14px;border:1px solid #7c3aed;border-radius:9px;font-size:14px;color:#18181b;background:#fff;resize:vertical;line-height:1.5;box-shadow:0 0 0 3px rgba(124,58,237,.1);outline:none;'\n      : 'width:100%;min-height:64px;padding:11px 14px;border:1px solid #e4e4e7;border-radius:9px;font-size:14px;color:#3f3f46;background:#fafafa;resize:none;line-height:1.5;outline:none;');\n    const evalInputStyle = (editMode\n      ? 'width:100%;padding:10px 13px;border:1px solid #7c3aed;border-radius:9px;font-size:14px;font-weight:600;color:#18181b;background:#fff;box-shadow:0 0 0 3px rgba(124,58,237,.1);outline:none;'\n      : 'width:100%;padding:10px 13px;border:1px solid #e4e4e7;border-radius:9px;font-size:14px;font-weight:600;color:#3f3f46;background:#fafafa;outline:none;');\n\n    const msgRaw = [\n      { name: 'María Sánchez', role: 'Destino', initials: 'MS', time: '20/6 09:16', text: 'Cargué el valor inicial del destino y adjunté el acta de constitución como evidencia.', self: false },\n      { name: 'Javier Pérez', role: 'Evaluador', initials: 'JP', time: '26/6 19:58', text: 'Confirmo. Ajusto a 97% según estándares internacionales; la evidencia respalda el cumplimiento.', self: true },\n      { name: 'María Sánchez', role: 'Destino', initials: 'MS', time: '26/6 20:05', text: '¡Gracias! Sumo el convenio público-privado como acción vinculada.', self: false },\n    ];\n    const mensajes = msgRaw.map(m => {\n      const self = m.self;\n      return {\n        name: m.name, role: m.role, initials: m.initials, time: m.time, text: m.text,\n        rowStyle: `display:flex;gap:11px;${self ? 'flex-direction:row-reverse;' : ''}`,\n        avatarStyle: `display:flex;align-items:center;justify-content:center;width:34px;height:34px;border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0;background:${self ? '#ede9fe' : accentSoft};color:${self ? violet : accent};`,\n        bubbleWrap: `max-width:74%;`,\n        metaAlign: self ? 'flex-direction:row-reverse;' : '',\n        bubble: `font-size:13.5px;color:#3f3f46;line-height:1.5;padding:10px 14px;border-radius:12px;${self ? `background:#f5f3ff;border:1px solid #ede9fe;border-top-right-radius:3px;` : `background:#fafafa;border:1px solid #f1f1f3;border-top-left-radius:3px;`}`,\n      };\n    });\n\n    return {\n      accent, accentSoft, accentBorder, destino, user, nav,\n      editMode, readMode: !editMode, editBtnLabel, editBtnStyle, toggleEdit: this.toggleEdit,\n      criterios,\n      linkOpen: this.state.linkOpen, toggleLink: this.toggleLink,\n      linkBtnStyle: this.state.linkOpen\n        ? `display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:${accentSoft};color:${accent};border:1px solid ${accentBorder};border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;`\n        : 'display:inline-flex;align-items:center;gap:7px;padding:8px 14px;background:#fff;color:#3f3f46;border:1px solid #e4e4e7;border-radius:9px;font-size:13px;font-weight:600;cursor:pointer;',\n      openCreate: this.openCreate, closeCreate: this.closeCreate, createOpen: this.state.createOpen, stop: this.stop,\n      linked, available, linkedCount: linkedIds.length,\n      hasLinked: linked.length > 0, noLinked: linked.length === 0,\n      hasAvailable: available.length > 0, noAvailable: available.length === 0,\n      historial, mensajes, mensajesCount: `${mensajes.length} mensajes`,\n      evalAreaStyle, evalInputStyle,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
  </script>
