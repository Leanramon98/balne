document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

Fdiv>\n        <\u002Fsc-if>\n\n        <!-- two-col layout -->\n        <div style=\"display:flex;gap:22px;align-items:flex-start;flex-wrap:wrap;\">\n\n          <!-- FORM CARD -->\n          <div style=\"flex:1;min-width:440px;background:#fff;border:1px solid #e4e4e7;border-radius:14px;overflow:hidden;\">\n            <div style=\"padding:20px 24px;border-bottom:1px solid #f1f1f3;\">\n              <div style=\"font-size:16px;font-weight:700;color:#18181b;\">Datos de la evaluación<\u002Fdiv>\n              <div style=\"font-size:13.5px;color:#71717a;margin-top:3px;\">Los campos marcados con <span style=\"color:#dc2626;font-weight:600;\">*<\u002Fspan> son obligatorios.<\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"padding:22px 24px;display:flex;flex-direction:column;gap:22px;\">\n\n              <!-- Nombre -->\n              <div>\n                <label style=\"display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:#3f3f46;margin-bottom:7px;\">Nombre <span style=\"color:#dc2626;\">*<\u002Fspan><\u002Flabel>\n                <input class=\"dti-in\" value=\"{{ nombre }}\" oninput=\"{{ onNombre }}\" placeholder=\"Ej. Autodiagnóstico 2026\" style=\"{{ nombreInputStyle }}\">\n                <sc-if value=\"{{ nombreError }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dc2626;margin-top:7px;\">\n                    <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\"><\u002Fline><line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\"><\u002Fline><\u002Fsvg>\n                    El nombre es obligatorio.\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <!-- Destino (prefilled / contextua solid #e4e4e7;border-radius:8px;background:#fff;flex-shrink:0;\" style-hover=\"font-size:13px;font-weight:600;color:{{ accent }};cursor:pointer;padding:5px 12px;border:1px solid #d4d4d8;border-radius:8px;background:#fafafa;flex-shrink:0;\">Cambiar<\u002Fspan>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n                <sc-if value=\"{{ destinoEditing }}\" hint-placeholder-val=\"{{ false }}\">\n                  <div>\n                    <div style=\"position:relative;\">\n                      <div onclick=\"{{ toggleDestinoMenu }}\" style=\"display:flex;align-items:center;gap:10px;padding:11px 14px;border:1px solid {{ accent }};border-radius:10px;background:#fff;cursor:pointer;box-shadow:0 0 0 3px {{ accentRing }};\">\n                        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;\"><path d=\"M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n                        <span style=\"flex:1;font-size:14px;color:#18181b;\">{{ activeDestino.name }}<\u002Fspan>\n                        <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#71717a\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n                      <\u002Fdiv>\n                      <sc-if value=\"{{ destinoMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n                        <div class=\"dti-scroll\" style=\"position:absolute;top:calc(100% + 6px);left:0;right:0;z-index:30;max-height:260px;overflow-y:auto;background:#fff;border:1px solid #e4e4e7;border-radius:11px;box-shadow:0 12px 32px -8px rgba(24,24,27,.16);padding:5px;\">\n                          <sc-for list=\"{{ destinoList }}\" as=\"d\" hint-placeholder-count=\"5\">\n                            <div onclick=\"{{ d.onSelect }}\" style=\"display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;\" style-hover=\"display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:8px;cursor:pointer;background:#f4f4f5;\">\n                              <span style=\"display:flex;flex-direction:column;line-height:1.3;flex:1;min-width:0;\">\n                                <span style=\"font-size:14px;font-weight:500;color:#18181b;\">{{ d.name }}<\u002Fspan>\n                                <span style=\"font-size:12px;color:#a1a1aa;\">{{ d.region }}<\u002Fspan>\n                              <\u002Fspan>\n                              <sc-if value=\"{{ d.isActive }}\" hint-placeholder-val=\"{{ false }}\">\n                                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                              <\u002Fsc-if>\n                            <\u002Fdiv>\n                          <\u002Fsc-for>\n                        <\u002Fdiv>\n                      <\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"font-size:12.5px;color:#a1a1aa;margin-top:7px;\">Cambiar el destino acá solo afecta a esta evaluación, no al contexto de la sesión.<\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-if>\n              <\u002Fdiv>\n\n              <!-- Tipo -->\n              <div>\n                <label style=\"display:flex;align-items:center;gap:6px;font-size:13.5px;font-weight:600;color:#3f3f46;margin-bottom:9px;\">Tipo de evaluación <span style=\"color:#dc2626;\">*<\u002Fspan><\u002Flabel>\n                <div style=\"display:flex;flex-direction:column;gap:10px;\">\n                  <sc-for list=\"{{ tipos }}\" as=\"t\" hint-placeholder-count=\"4\">\n                    <div onclick=\"{{ t.onClick }}\" style=\"{{ t.cardStyle }}\">\n                      <span style=\"{{ t.radioStyle }}\">\n                        <sc-if value=\"{{ t.selected }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:9px;height:9px;border-radius:50%;background:#fff;\"><\u002Fspan><\u002Fsc-if>\n                        <sc-if value=\"{{ t.disabled }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"12\" height=\"12\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a1a1aa\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><rect width=\"18\" height=\"11\" x=\"3\" y=\"11\" rx=\"2\" ry=\"2\"><\u002Frect><path d=\"M7 11V7a5 5 0 0 1 10 0v4\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                      <\u002Fspan>\n                      <div style=\"flex:1;min-width:0;\">\n                        <div style=\"display:flex;align-items:center;gap:9px;flex-wrap:wrap;\">\n                          <span style=\"{{ t.titleStyle }}\">{{ t.label }}<\u002Fspan>\n                          <span style=\"{{ t.chipStyle }}\">{{ t.chip }}<\u002Fspan>\n                        <\u002Fdiv>\n                        <div style=\"font-size:12.5px;color:#71717a;margin-top:3px;line-height:1.45;\">{{ t.desc }}<\u002Fdiv>\n                        <sc-if value=\"{{ t.disabled }}\" hint-placeholder-val=\"{{ false }}\">\n                          <div onclick=\"{{ t.onPromote }}\" style=\"display:inline-flex;align-items:center;gap:5px;font-size:12.5px;font-weight:600;color:{{ accent }};margin-top:8px;cursor:pointer;\">\n                            {{ t.action }}\n                            <svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M5 12h14\"><\u002Fpath><path d=\"m12 5 7 7-7 7\"><\u002Fpath><\u002Fsvg>\n                          <\u002Fdiv>\n                        <\u002Fsc-if>\n                      <\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fsc-for>\n                <\u002Fdiv>\n              <\u002Fdiv>\n\n              <!-- Fechas -->\n              <div style=\"display:flex;gap:16px;flex-wrap:wrap;\">\n                <div style=\"flex:1;min-width:180px;\">\n                  <label style=\"display:block;font-size:13.5px;font-weight:600;color:#3f3f46;margin-bottom:7px;\">Fecha desde<\u002Flabel>\n                  <input class=\"dti-in\" type=\"date\" value=\"{{ desde }}\" oninput=\"{{ onDesde }}\" style=\"{{ dateStyle }}\">\n                <\u002Fdiv>\n                <div style=\"flex:1;min-width:180px;\">\n                  <label style=\"display:block;font-size:13.5px;font-weight:600;color:#3f3f46;margin-bottom:7px;\">Fecha hasta<\u002Flabel>\n                  <input class=\"dti-in\" type=\"date\" value=\"{{ hasta }}\" oninput=\"{{ onHasta }}\" style=\"{{ dateStyle }}\">\n                  <sc-if value=\"{{ fechaError }}\" hint-placeholder-val=\"{{ false }}\">\n                    <div style=\"display:flex;align-items:center;gap:6px;font-size:12.5px;color:#dc2626;margin-top:7px;\">\n                      <svg width=\"14\" height=\"14\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><line x1=\"12\" x2=\"12\" y1=\"8\" y2=\"12\"><\u002Fline><line x1=\"12\" x2=\"12.01\" y1=\"16\" y2=\"16\"><\u002Fline><\u002Fsvg>\n                      La fecha hasta debe ser posterior a la fecha desde.\n                    <\u002Fdiv>\n                  <\u002Fsc-if>\n                <\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <!-- footer -->\n            <div style=\"display:flex;align-items:center;justify-content:space-between;gap:14px;padding:16px 24px;border-top:1px solid #f1f1f3;background:#fafafa;flex-wrap:wrap;\">\n              <sc-if value=\"{{ savedOk }}\" hint-placeholder-val=\"{{ false }}\">\n                <span style=\"display:flex;align-items:center;gap:7px;font-size:13.5px;font-weight:600;color:#15803d;\">\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.4\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg>\n                  Evaluación creada\n                <\u002Fspan>\n              <\u002Fsc-if>\n              <sc-if value=\"{{ notSaved }}\" hint-placeholder-val=\"{{ true }}\"><span><\u002Fspan><\u002Fsc-if>\n              <div style=\"display:flex;align-items:center;gap:10px;margin-left:auto;\">\n                <button style=\"padding:10px 16px;background:#fff;color:#3f3f46;border:1px solid #e4e4e7;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;\" style-hover=\"padding:10px 16px;background:#fafafa;color:#18181b;border:1px solid #d4d4d8;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;\">Cancelar<\u002Fbutton>\n                <button onclick=\"{{ onSubmit }}\" style=\"display:flex;align-items:center;gap:8px;padding:10px 18px;background:#18181b;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;\" style-hover=\"display:flex;align-items:center;gap:8px;padding:10px 18px;background:#000;color:#fff;border:none;border-radius:9px;font-size:14px;font-weight:600;cursor:pointer;\">\n                  <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M19 21v-8H5v8\"><\u002Fpath><path d=\"M5 3v5h11\"><\u002Fpath><path d=\"M15.2 3H5a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2V8.8a2 2 0 0 0-.6-1.4l-3.8-3.8A2 2 0 0 0 15.2 3z\"><\u002Fpath><\u002Fsvg>\n                  Crear evaluación\n                <\u002Fbutton>\n              <\u002Fdiv>\n            <\u002Fdiv>\n          <\u002Fdiv>\n\n          <!-- HELP ASIDE -->\n          <aside style=\"width:320px;flex-shrink:0;display:flex;flex-direction:column;gap:16px;\">\n            <div style=\"background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:18px 20px;\">\n              <div style=\"display:flex;align-items:center;gap:9px;margin-bottom:6px;\">\n                <svg width=\"17\" height=\"17\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"M12 16v-4\"><\u002Fpath><path d=\"M12 8h.01\"><\u002Fpath><\u002Fsvg>\n                <span style=\"font-size:14.5px;font-weight:700;color:#18181b;\">Ciclo de evaluación DTI<\u002Fspan>\n              <\u002Fdiv>\n              <p style=\"font-size:13px;color:#71717a;line-height:1.5;margin-bottom:16px;\">El tipo determina cómo se crea. Cada tipo nace de la promoción del anterior una vez cerrado.<\u002Fp>\n\n              <div style=\"display:flex;flex-direction:column;\">\n                <sc-for list=\"{{ flow }}\" as=\"f\" hint-placeholder-count=\"3\">\n                  <div style=\"display:flex;gap:12px;\">\n                    <div style=\"display:flex;flex-direction:column;align-items:center;flex-shrink:0;\">\n                      <span style=\"{{ f.dotStyle }}\">{{ f.n }}<\u002Fspan>\n                      <sc-if value=\"{{ f.line }}\" hint-placeholder-val=\"{{ true }}\"><span style=\"width:2px;flex:1;background:#e4e4e7;min-height:18px;\"><\u002Fspan><\u002Fsc-if>\n                    <\u002Fdiv>\n                    <div style=\"padding-bottom:16px;\">\n                      <div style=\"font-size:13.5px;font-weight:600;color:#18181b;\">{{ f.title }}<\u002Fdiv>\n                      <div style=\"font-size:12.5px;color:#71717a;line-height:1.45;margin-top:2px;\">{{ f.body }}<\u002Fdiv>\n                    <\u002Fdiv>\n                  <\u002Fdiv>\n                <\u002Fsc-for>\n              <\u002Fdiv>\n\n              <div style=\"display:flex;gap:10px;background:#fafafa;border:1px solid #f1f1f3;border-radius:10px;padding:11px 13px;margin-top:4px;\">\n                <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"{{ accent }}\" stroke-width=\"2.2\" stroke-linecap=\"round\" stroke-linejoin=\"round\" style=\"flex-shrink:0;margin-top:1px;\"><circle cx=\"12\" cy=\"12\" r=\"10\"><\u002Fcircle><path d=\"m9 12 2 2 4-4\"><\u002Fpath><\u002Fsvg>\n                <div style=\"font-size:12.5px;color:#52525b;line-height:1.5;\"><span style=\"font-weight:600;color:#18181b;\">Medición Espontánea<\u002Fspan> es libre: se crea en cualquier momento, sin requisitos previos.<\u002Fdiv>\n              <\u002Fdiv>\n            <\u002Fdiv>\n\n            <div style=\"background:#fff;border:1px solid #e4e4e7;border-radius:14px;padding:16px 20px;\">\n              <div style=\"font-size:12px;font-weight:600;letter-spacing:.04em;color:#a1a1aa;text-transform:uppercase;margin-bottom:11px;\">Estado del ciclo · {{ activeDestino.name }}<\u002Fdiv>\n              <sc-for list=\"{{ cycleState }}\" as=\"c\" hint-placeholder-count=\"3\">\n                <div style=\"display:flex;align-items:center;gap:10px;padding:7px 0;\">\n                  <span style=\"{{ c.iconStyle }}\">\n                    <sc-if value=\"{{ c.done }}\" hint-placeholder-val=\"{{ false }}\"><svg width=\"13\" height=\"13\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2.6\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"M20 6 9 17l-5-5\"><\u002Fpath><\u002Fsvg><\u002Fsc-if>\n                    <sc-if value=\"{{ c.pending }}\" hint-placeholder-val=\"{{ false }}\"><span style=\"width:6px;height:6px;border-radius:50%;background:currentColor;\"><\u002Fspan><\u002Fsc-if>\n                  <\u002Fspan>\n                  <span style=\"flex:1;font-size:13px;color:#3f3f46;\">{{ c.label }}<\u002Fspan>\n                  <span style=\"{{ c.tagStyle }}\">{{ c.tag }}<\u002Fspan>\n                <\u002Fdiv>\n              <\u002Fsc-for>\n            <\u002Fdiv>\n          <\u002Faside>\n        <\u002Fdiv>\n      <\u002Fdiv>\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ destinoMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeDestinoMenu }}\" style=\"position:fixed;inset:0;z-index:20;background:transparent;\"><\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;$preview&quot;:{&quot;width&quot;:1440,&quot;height&quot;:960},&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2563eb&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2563eb&quot;,&quot;#0f766e&quot;,&quot;#7c3aed&quot;,&quot;#db2777&quot;],&quot;section&quot;:&quot;Apariencia&quot;}}\">\nclass Component extends DCLogic {\n  state = {\n    nombre: '', tipo: 'autodiagnostico', desde: '', hasta: '',\n    destinoEditing: false, destinoMenuOpen: false, activeDestino: 0,\n    submitted: false, saved: false,\n  };\n\n  onNombre = (e) => this.setState({ nombre: e.target.value, saved: false });\n  onDesde = (e) => this.setState({ desde: e.target.value, saved: false });\n  onHasta = (e) => this.setState({ hasta: e.target.value, saved: false });\n  onUnlockDestino = () => this.setState({ destinoEditing: true });\n  toggleDestinoMenu = () => this.setState(s => ({ destinoMenuOpen: !s.destinoMenuOpen }));\n  closeDestinoMenu = () => this.setState({ destinoMenuOpen: false });\n  selectDestino = (i) => this.setState({ activeDestino: i, destinoMenuOpen: false });\n  selectTipo = (k, disabled) => { if (!disabled) this.setState({ tipo: k, saved: false }); };\n\n  validate() {\n    const nameOk = this.state.nombre.trim().length > 0;\n    const fechaOk = !(this.state.desde && this.state.hasta && this.state.hasta < this.state.desde);\n    return { nameOk, fechaOk, ok: nameOk && fechaOk };\n  }\n\n  onSubmit = () => {\n    const v = this.validate();\n    this.setState({ submitted: true, saved: v.ok });\n  };\n\n  renderVals() {\n    const accent = this.props.accentColor || '#2563eb';\n    const accentSoft = `color-mix(in srgb, ${accent} 12%, #ffffff)`;\n    const accentRing = `color-mix(in srgb, ${accent} 18%, transparent)`;\n\n    const destinos = [\n      { name: 'Ciudad de Buenos Aires', region: 'Argentina' },\n      { name: 'San Carlos de Bariloche', region: 'Argentina' },\n      { name: 'Cartagena de Indias', region: 'Colombia' },\n      { name: 'Medellín', region: 'Colombia' },\n      { name: 'Cusco', region: 'Perú' },\n      { name: 'Punta del Este', region: 'Uruguay' },\n      { name: 'Querétaro', region: 'México' },\n    ];\n    const ai = this.state.activeDestino;\n    const activeDestino = destinos[ai];\n    const destinoList = destinos.map((d, i) => ({\n      name: d.name, region: d.region, isActive: i === ai, onSelect: () => this.selectDestino(i),\n    }));\n\n    // ---- nav (static, evaluaciones active) ----\n    const base = 'display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;';\n    const idle = (muted) => base + `font-weight:500;color:${muted ? '#71717a' : '#3f3f46'};background:transparent;`;\n    const activeStyle = base + `font-weight:600;color:${accent};background:${accentSoft};`;\n    const nav = {\n      destino: idle(), evaluacionesActive: activeStyle, ambitos: idle(), indicadores: idle(),\n      acciones: idle(), plan: idle(), resultados: idle(), informes: idle(), config: idle(true),\n    };\n\n    // ---- validation ----\n    const v = this.validate();\n    const submitted = this.state.submitted;\n    const nombreError = submitted && !v.nameOk;\n    const fechaError = submitted && !v.fechaOk;\n    const showErrorSummary = submitted && !v.ok;\n    const errs = [];\n    if (nombreError) errs.push('Falta el nombre');\n    if (fechaError) errs.push('Rango de fechas inválido');\n    const errorSummaryText = errs.join(' · ');\n\n    const inputBase = 'width:100%;padding:11px 14px;border-radius:10px;font-size:14px;color:#18181b;background:#fff;';\n    const nombreInputStyle = inputBase + (nombreError\n      ? 'border:1px solid #dc2626;box-shadow:0 0 0 3px rgba(220,38,38,.12);'\n      : `border:1px solid #e4e4e7;`);\n    const dateStyle = inputBase + 'border:1px solid #e4e4e7;color:#3f3f46;';\n\n    // ---- tipo cards ----\n    // Cycle availability (mock context: hay autodiagnóstico cerrado y diagnóstico cerrado)\n    const tieneAutodiagCerrado = true;\n    const tieneDiagCerrado = true;\n    const tipoDefs = [\n      {\n        k: 'autodiagnostico', label: 'Autodiagnóstico', chip: 'Libre',\n        desc: 'Punto de partida del ciclo. Lo carga el propio destino para una autoevaluación inicial.',\n        disabled: false,\n      },\n      {\n        k: 'medicion', label: 'Medición Espontánea', chip: 'Libre',\n        desc: 'Medición puntual e independiente. Se crea en cualquier momento, sin requisitos previos.',\n        disabled: false,\n      },\n      {\n        k: 'diagnostico', label: 'Diagnóstico', chip: tieneAutodiagCerrado ? 'Por promoción' : 'No disponible',\n        desc: 'Se crea promoviendo un Autodiagnóstico cerrado. No se inicia desde este formulario.',\n        disabled: true,\n        action: tieneAutodiagCerrado ? 'Promover desde un Autodiagnóstico cerrado' : 'Requiere un Autodiagnóstico cerrado',\n      },\n      {\n        k: 'auditoria', label: 'Auditoría', chip: tieneDiagCerrado ? 'Por promoción' : 'No disponible',\n        desc: 'Se crea promoviendo un Diagnóstico cerrado. No se inicia desde este formulario.',\n        disabled: true,\n        action: tieneDiagCerrado ? 'Promover desde un Diagnóstico cerrado' : 'Requiere un Diagnóstico cerrado',\n      },\n    ];\n    const tipos = tipoDefs.map(t => {\n      const selected = this.state.tipo === t.k && !t.disabled;\n      const cardStyle = t.disabled\n        ? 'display:flex;gap:13px;padding:14px 15px;border:1px solid #ededf0;border-radius:11px;background:#fafafa;cursor:not-allowed;'\n        : selected\n          ? `display:flex;gap:13px;padding:14px 15px;border:1.5px solid ${accent};border-radius:11px;background:${accentSoft};cursor:pointer;box-shadow:0 0 0 3px ${accentRing};`\n          : 'display:flex;gap:13px;padding:14px 15px;border:1px solid #e4e4e7;border-radius:11px;background:#fff;cursor:pointer;';\n      const radioStyle = `display:flex;align-items:center;justify-content:center;width:20px;height:20px;border-radius:50%;flex-shrink:0;margin-top:1px;` + (\n        selected ? `background:${accent};border:1.5px solid ${accent};`\n        : t.disabled ? 'background:#f4f4f5;border:1.5px solid #e4e4e7;'\n        : 'background:#fff;border:1.5px solid #d4d4d8;');\n      const titleStyle = `font-size:14.5px;font-weight:600;color:${t.disabled ? '#71717a' : '#18181b'};`;\n      const chipColor = t.disabled\n        ? 'background:#f1f1f3;color:#71717a;border:1px solid #e4e4e7;'\n        : `background:#fff;color:${accent};border:1px solid ${accent}33;`;\n      const chipStyle = 'display:inline-flex;align-items:center;padding:2px 9px;border-radius:9999px;font-size:11px;font-weight:600;letter-spacing:.02em;' + chipColor;\n      return {\n        label: t.label, desc: t.desc, chip: t.chip, action: t.action,\n        selected, disabled: t.disabled, cardStyle, radioStyle, titleStyle, chipStyle,\n        onClick: () => this.selectTipo(t.k, t.disabled),\n        onPromote: (e) => { e.stopPropagation && e.stopPropagation(); },\n      };\n    });\n\n    // ---- flow diagram ----\n    const dot = (active) => `display:flex;align-items:center;justify-content:center;width:24px;height:24px;border-radius:50%;font-size:12px;font-weight:700;flex-shrink:0;` + (\n      active ? `background:${accent};color:#fff;` : 'background:#f1f1f3;color:#71717a;');\n    const flow = [\n      { n: '1', title: 'Autodiagnóstico', body: 'Lo inicia el destino. Al cerrarlo se habilita el Diagnóstico.', line: true, dotStyle: dot(true) },\n      { n: '2', title: 'Diagnóstico', body: 'Se promueve desde un Autodiagnóstico cerrado. Al cerrarlo habilita la Auditoría.', line: true, dotStyle: dot(false) },\n      { n: '3', title: 'Auditoría', body: 'Se promueve desde un Diagnóstico cerrado. Verificación final del ciclo.', line: false, dotStyle: dot(false) },\n    ];\n\n    // ---- cycle state for active destino ----\n    const okIcon = 'display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#dcfce7;color:#16a34a;flex-shrink:0;';\n    const pendIcon = 'display:flex;align-items:center;justify-content:center;width:22px;height:22px;border-radius:50%;background:#f1f1f3;color:#a1a1aa;flex-shrink:0;';\n    const okTag = 'font-size:11.5px;font-weight:600;color:#166534;background:#dcfce7;padding:2px 9px;border-radius:9999px;';\n    const pendTag = 'font-size:11.5px;font-weight:500;color:#71717a;background:#f4f4f5;padding:2px 9px;border-radius:9999px;';\n    const cycleState = [\n      { label: 'Autodiagnóstico', done: true, pending: false, iconStyle: okIcon, tag: 'Cerrado', tagStyle: okTag },\n      { label: 'Diagnóstico', done: true, pending: false, iconStyle: okIcon, tag: 'Cerrado', tagStyle: okTag },\n      { label: 'Auditoría', done: false, pending: true, iconStyle: pendIcon, tag: 'Disponible', tagStyle: pendTag },\n    ];\n\n    return {\n      accent, accentSoft, accentRing, nav, activeDestino, destinoList,\n      user: { name: 'María Sánchez', role: 'Administradora', initials: 'MS' },\n      nombre: this.state.nombre, desde: this.state.desde, hasta: this.state.hasta,\n      nombreInputStyle, dateStyle, nombreError, fechaError, showErrorSummary, errorSummaryText,\n      onNombre: this.onNombre, onDesde: this.onDesde, onHasta: this.onHasta, onSubmit: this.onSubmit,\n      destinoLocked: !this.state.destinoEditing, destinoEditing: this.state.destinoEditing,\n      destinoMenuOpen: this.state.destinoMenuOpen,\n      onUnlockDestino: this.onUnlockDestino, toggleDestinoMenu: this.toggleDestinoMenu, closeDestinoMenu: this.closeDestinoMenu,\n      tipos, flow, cycleState,\n      savedOk: this.state.saved, notSaved: !this.state.saved,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
