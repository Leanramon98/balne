document.addEventListener('DOMContentLoaded', async function() {
  const loading = document.getElementById('__bundler_loading');
  function setStatus(msg) { if (loading) loading.textContent = msg; }

  // Error sink persists across replaceWith since it's on window, not the DOM.
  window.addEventListener('error', function(e) {
    var p = document.body || document.documentElement;
    var d = document.getElementById('__bundler_err') || p.appendChild(document.createElement('div'));
    d.id = '__bundler_err';
    d.style.cssText = 'position:fixed;bottom:12px;left:12px;right:12px;font:12px/1.4 ui-monospace,monospace;background:#2a1215;color:#ff8a80;padding:10px 14px;border-radius:8px;border:1px solid #5c2b2e;z-index:99999;white-space:pre-wrap;max-height:40vh;overflow:auto';
    d.textContent = (d.textContent ? d.textContent + String.fromCharCode(10) : '') +
      '[bundle] ' + (e.message || e.type) +
      (e.filename ? ' (' + e.filename.slice(0, 60) + ':' + e.lineno + ')' : '');
  }, true);

  try {
    const manifestEl = document.querySelector('script[type="__bundler/manifest"]');
    const templateEl = document.querySelector('script[type="__bundler/template"]');
    if (!manifestEl || !templateEl) {
      setStatus('Error: missing bundle data');
      console.error('[bundler] Missing script tags — manifestEl:', !!manifestEl, 'templateEl:', !!templateEl);
      return;
    }

    const manifest = JSON.parse(manifestEl.textContent);
    let template = JSON.parse(templateEl.textContent);

    const uuids = Object.keys(manifest);
    setStatus('Unpacking ' + uuids.length + ' assets...');

    const blobUrls = {};
    await Promise.all(uuids.map(async (uuid) => {
      const entry = manifest[uuid];
      try {
        const binaryStr = atob(entry.data);
        const bytes = new Uint8Array(binaryStr.length);
        for (let i = 0; i < binaryStr.length; i++) bytes[i] = binaryStr.charCodeAt(i);

        let finalBytes = bytes;
        if (entry.compressed) {
          if (typeof DecompressionStream !== 'undefined') {
            const ds = new DecompressionStream('gzip');
            const writer = ds.writable.getWriter();
            const reader = ds.readable.getReader();
            writer.write(bytes);
            writer.close();
            const chunks = [];
            let totalLen = 0;
            while (true) {
              const { done, value } = await reader.read();
              if (done) break;
              chunks.push(value);
              totalLen += value.length;
            }
            finalBytes = new Uint8Array(totalLen);
            let offset = 0;
            for (const chunk of chunks) { finalBytes.set(chunk, offset); offset += chunk.length; }
          } else {
            console.warn('DecompressionStream not available, asset ' + uuid + ' may not render');
          }
        }

        blobUrls[uuid] = URL.createObjectURL(new Blob([finalBytes], { type: entry.mime }));
      } catch (err) {
        console.error('Failed to decode asset ' + uuid + ':', err);
        blobUrls[uuid] = URL.createObjectURL(new Blob([], { type: entry.mime }));
      }
    }));

    const extResEl = document.querySelector('script[type="__bundler/ext_resources"]');
    const extResources = extResEl ? JSON.parse(extResEl.textContent) : [];
    const resourceMap = {};
    for (const entry of extResources) {
      if (blobUrls[entry.uuid]) resourceMap[entry.id] = blobUrls[entry.uuid];
    }

    setStatus('Rendering...');
    for (const uuid of uuids) template = template.split(uuid).join(blobUrls[uuid]);

    // Strip integrity + crossorigin — blob URLs from a file:// document inherit
    // a null origin, so crossorigin forces a CORS fetch that SRI then rejects.
    // The manifest bytes are ours; SRI protects against CDN compromise, not this.
    template = template.replace(/\s+integrity="[^"]*"/gi, '').replace(/\s+crossorigin="[^"]*"/gi, '');

    const resourceScript = '<script>window.__resources = ' +
      JSON.stringify(resourceMap).split('</' + 'script>').join('<\\/' + 'script>') +
      ';</' + 'script>';
    // Inject after <head> so the DOCTYPE stays first; prepending the script
    // would push the parser into quirks mode. DOMParser always emits a <head>
    // (synthesizing one if the source HTML omitted it) but may carry
    // attributes through, so match the full opening tag. slice() rather than
    // replace() keeps us clear of $-pattern substitution in resourceScript.
    const headOpen = template.match(/<head[^>]*>/i);
    if (headOpen) {
      const i = headOpen.index + headOpen[0].length;
      template = template.slice(0, i) + resourceScript + template.slice(i);
    }

    // Parse the template and swap the root element. Scripts inserted via
    // DOMParser/replaceWith are inert per spec — re-create each with
    // createElement so they execute, awaiting onload for src scripts to
    // preserve ordering (React before ReactDOM before Babel before text/babel).
    const doc = new DOMParser().parseFromString(template, 'text/html');
    document.documentElement.replaceWith(doc.documentElement);
    const dead = Array.from(document.scripts);
    for (const old of dead) {
      const s = document.createElement('script');
      for (const a of old.attributes) s.setAttribute(a.name, a.value);
      s.textContent = old.textContent;
      // text/babel scripts with a src: fetch and inline. transformScriptTags
      // does XHR against the src, but blob:null/ from a file:// origin is
      // silently dropped. Inlining makes it a plain inline babel script,
      // which transformScriptTags handles unconditionally.
      if ((s.type === 'text/babel' || s.type === 'text/jsx') && s.src) {
        const r = await fetch(s.src);
        s.textContent = await r.text();
        s.removeAttribute('src');
      }
      const p = s.src ? new Promise(function(r) { s.onload = s.onerror = r; }) : null;
      old.replaceWith(s);
      if (p) await p;
    }
    // Babel standalone auto-transforms type=text/babel on DOMContentLoaded,
    // which fired before we swapped the document. Trigger manually if present.
    if (window.Babel && typeof window.Babel.transformScriptTags === 'function') {
      window.Babel.transformScriptTags();
    }
  } catch (err) {
    setStatus('Error unpacking: ' + err.message);
    console.error('Bundle unpack error:', err);
  }
});

12-8 12s-8-6-8-12a8 8 0 0 1 16 0Z\"><\u002Fpath><circle cx=\"12\" cy=\"10\" r=\"3\"><\u002Fcircle><\u002Fsvg>\n            Destino: <span style=\"color:#18181b;font-weight:600;\">{{ activeDestino.name }}<\u002Fspan>\n            <span onclick=\"{{ toggleDestino }}\" style=\"color:{{ accent }};font-weight:600;cursor:pointer;padding:1px 8px;border-radius:9999px;background:#fff;border:1px solid #e4e4e7;\">Cambiar<\u002Fspan>\n          <\u002Fspan>\n        <\u002Fdiv>\n        <div style=\"display:flex;gap:12px;flex-wrap:wrap;\">\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:220px;flex:1;max-width:280px;padding:9px 14px;border:1px solid #e4e4e7;border-radius:9px;background:#fff;color:#3f3f46;font-size:14px;cursor:pointer;\" style-hover=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:220px;flex:1;max-width:280px;padding:9px 14px;border:1px solid #d4d4d8;border-radius:9px;background:#fafafa;color:#3f3f46;font-size:14px;cursor:pointer;\">\n            <span>Todos los tipos<\u002Fspan>\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a1a1aa\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n          <div style=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:220px;flex:1;max-width:280px;padding:9px 14px;border:1px solid #e4e4e7;border-radius:9px;background:#fff;color:#3f3f46;font-size:14px;cursor:pointer;\" style-hover=\"display:flex;align-items:center;justify-content:space-between;gap:10px;min-width:220px;flex:1;max-width:280px;padding:9px 14px;border:1px solid #d4d4d8;border-radius:9px;background:#fafafa;color:#3f3f46;font-size:14px;cursor:pointer;\">\n            <span>Todos los estados<\u002Fspan>\n            <svg width=\"16\" height=\"16\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"#a1a1aa\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><path d=\"m6 9 6 6 6-6\"><\u002Fpath><\u002Fsvg>\n          <\u002Fdiv>\n        <\u002Fdiv>\n      <\u002Fdiv>\n\n      <!-- table card -->\n      <div class=\"dti-scroll\" style=\"background:#fff;border:1px solid #e4e4e7;border-radius:12px;overflow-x:auto;\">\n        <div style=\"display:grid;grid-template-columns:minmax(220px,2.2fr) 1.3fr 1.1fr 0.9fr 0.9fr 1.1fr 70px;align-items:center;padding:13px 20px;border-bottom:1px solid #e4e4e7;background:#fafafa;font-size:12px;font-weight:600;letter-spacing:.02em;color:#71717a;text-transform:uppercase;min-width:820px;\">\n          <span>Nombre<\u002Fspan><span>Tipo<\u002Fspan><span>Estado<\u002Fspan><span>Fecha desde<\u002Fspan><span>Fecha hasta<\u002Fspan><span>Creada por<\u002Fspan><span style=\"text-align:right;\">Acciones<\u002Fspan>\n        <\u002Fdiv>\n        <sc-for list=\"{{ rows }}\" as=\"r\" hint-placeholder-count=\"6\">\n          <div style=\"display:grid;grid-template-columns:minmax(220px,2.2fr) 1.3fr 1.1fr 0.9fr 0.9fr 1.1fr 70px;align-items:center;padding:14px 20px;border-top:1px solid #f4f4f5;font-size:14px;min-width:820px;\" style-hover=\"display:grid;grid-template-columns:minmax(220px,2.2fr) 1.3fr 1.1fr 0.9fr 0.9fr 1.1fr 70px;align-items:center;padding:14px 20px;border-top:1px solid #f4f4f5;font-size:14px;min-width:820px;background:#fafafa;\">\n            <span style=\"font-weight:600;color:#18181b;cursor:pointer;\" style-hover=\"font-weight:600;color:{{ accent }};cursor:pointer;\">{{ r.nombre }}<\u002Fspan>\n            <span><span style=\"display:inline-flex;align-items:center;padding:3px 11px;border-radius:9999px;font-size:12.5px;font-weight:500;border:1px solid #e4e4e7;color:#3f3f46;background:#fff;\">{{ r.tipo }}<\u002Fspan><\u002Fspan>\n            <span><span style=\"{{ r.badgeStyle }}\">{{ r.estado }}<\u002Fspan><\u002Fspan>\n            <span style=\"color:#52525b;\">{{ r.desde }}<\u002Fspan>\n            <span style=\"color:#52525b;\">{{ r.hasta }}<\u002Fspan>\n            <span style=\"color:#52525b;\">{{ r.autor }}<\u002Fspan>\n            <span style=\"text-align:right;\">\n              <span style=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;color:#71717a;cursor:pointer;\" style-hover=\"display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:7px;color:#18181b;cursor:pointer;background:#f4f4f5;\">\n                <svg width=\"18\" height=\"18\" viewBox=\"0 0 24 24\" fill=\"none\" stroke=\"currentColor\" stroke-width=\"2\" stroke-linecap=\"round\" stroke-linejoin=\"round\"><circle cx=\"12\" cy=\"12\" r=\"1\"><\u002Fcircle><circle cx=\"19\" cy=\"12\" r=\"1\"><\u002Fcircle><circle cx=\"5\" cy=\"12\" r=\"1\"><\u002Fcircle><\u002Fsvg>\n              <\u002Fspan>\n            <\u002Fspan>\n          <\u002Fdiv>\n        <\u002Fsc-for>\n      <\u002Fdiv>\n\n    <\u002Fdiv>\n  <\u002Fmain>\n\n  <sc-if value=\"{{ anyMenuOpen }}\" hint-placeholder-val=\"{{ false }}\">\n    <div onclick=\"{{ closeMenus }}\" style=\"position:fixed;inset:0;z-index:40;background:transparent;\"><\u002Fdiv>\n  <\u002Fsc-if>\n<\u002Fdiv>\n<\u002Fx-dc>\n<script type=\"text/x-dc\" data-dc-script=\"\" data-props=\"{&quot;accentColor&quot;:{&quot;editor&quot;:&quot;color&quot;,&quot;default&quot;:&quot;#2563eb&quot;,&quot;tsType&quot;:&quot;string&quot;,&quot;options&quot;:[&quot;#2563eb&quot;,&quot;#0f766e&quot;,&quot;#7c3aed&quot;,&quot;#db2777&quot;],&quot;section&quot;:&quot;Apariencia&quot;},&quot;showSectionLabels&quot;:{&quot;editor&quot;:&quot;boolean&quot;,&quot;default&quot;:true,&quot;tsType&quot;:&quot;boolean&quot;,&quot;section&quot;:&quot;Sidebar&quot;}}\">\nclass Component extends DCLogic {\n  state = { activeNav: 'evaluaciones', destinoOpen: false, userOpen: false, activeDestino: 0 };\n\n  toggleDestino = () => this.setState(s => ({ destinoOpen: !s.destinoOpen, userOpen: false }));\n  toggleUser = () => this.setState(s => ({ userOpen: !s.userOpen, destinoOpen: false }));\n  closeMenus = () => this.setState({ destinoOpen: false, userOpen: false });\n  setNav = (k) => this.setState({ activeNav: k, destinoOpen: false, userOpen: false });\n  selectDestino = (i) => this.setState({ activeDestino: i, destinoOpen: false });\n\n  renderVals() {\n    const accent = this.props.accentColor || '#2563eb';\n    const accentSoft = `color-mix(in srgb, ${accent} 12%, #ffffff)`;\n    const showLabels = this.props.showSectionLabels !== false;\n\n    const destinos = [\n      { name: 'Ciudad de Buenos Aires', region: 'Argentina' },\n      { name: 'San Carlos de Bariloche', region: 'Argentina' },\n      { name: 'Cartagena de Indias', region: 'Colombia' },\n      { name: 'Medellín', region: 'Colombia' },\n      { name: 'Cusco', region: 'Perú' },\n      { name: 'Punta del Este', region: 'Uruguay' },\n      { name: 'Querétaro', region: 'México' },\n    ];\n    const ai = this.state.activeDestino;\n    const activeDestino = destinos[ai];\n    const destinoList = destinos.map((d, i) => ({\n      name: d.name, region: d.region, isActive: i === ai, onSelect: () => this.selectDestino(i),\n    }));\n\n    const base = 'display:flex;align-items:center;gap:11px;padding:8px 10px;border-radius:8px;font-size:14px;cursor:pointer;text-decoration:none;transition:background-color .12s ease,color .12s ease;';\n    const navItem = (k, muted) => {\n      const active = this.state.activeNav === k;\n      if (active) {\n        const s = base + `font-weight:600;color:${accent};background:${accentSoft};`;\n        return { style: s, hover: s, active: true, onClick: () => this.setNav(k) };\n      }\n      const col = muted ? '#71717a' : '#3f3f46';\n      const hcol = muted ? '#52525b' : '#18181b';\n      return {\n        style: base + `font-weight:500;color:${col};background:transparent;`,\n        hover: base + `font-weight:500;color:${hcol};background:#f4f4f5;`,\n        active: false, onClick: () => this.setNav(k),\n      };\n    };\n    const nav = {\n      destino: navItem('destino'), evaluaciones: navItem('evaluaciones'),\n      ambitos: navItem('ambitos'), indicadores: navItem('indicadores'),\n      acciones: navItem('acciones'), plan: navItem('plan'),\n      resultados: navItem('resultados'), informes: navItem('informes'),\n      config: navItem('config', true),\n    };\n\n    const badge = {\n      'Cerrada': { bg: '#dcfce7', fg: '#166534' },\n      'Borrador': { bg: '#f4f4f5', fg: '#52525b' },\n      'Carga finalizada': { bg: '#fef9c3', fg: '#854d0e' },\n      'En evaluación': { bg: '#fef9c3', fg: '#854d0e' },\n      'En curso': { bg: '#dbeafe', fg: '#1d4ed8' },\n    };\n    const raw = [\n      ['Autodiagnóstico 2025', 'Autodiagnóstico', 'Cerrada', '31/1/2025', '29/10/2025', 'M. Sánchez'],\n      ['Auditoría 2025', 'Auditoría', 'Cerrada', '31/3/2025', '29/11/2025', 'J. Pérez'],\n      ['Diagnóstico 2026', 'Diagnóstico', 'Cerrada', '14/1/2026', '29/6/2026', 'M. Sánchez'],\n      ['Autodiagnóstico Inicial', 'Autodiagnóstico', 'Borrador', '—', '—', 'L. Gómez'],\n      ['Medición Espontánea Q1 2026', 'Medición Espontánea', 'Carga finalizada', '31/12/2025', '30/3/2026', 'C. Ruiz'],\n      ['Auditoría Anual 2026', 'Auditoría', 'En evaluación', '31/1/2026', '30/7/2026', 'J. Pérez'],\n      ['Autodiagnóstico 2026', 'Autodiagnóstico', 'Borrador', '—', '—', 'M. Sánchez'],\n      ['Diagnóstico 2025', 'Diagnóstico', 'Cerrada', '28/2/2025', '19/12/2025', 'L. Gómez'],\n      ['Autodiagnóstico 2026', 'Autodiagnóstico', 'En curso', '14/1/2026', '29/6/2026', 'C. Ruiz'],\n    ];\n    const rows = raw.map(r => {\n      const b = badge[r[2]];\n      return {\n        nombre: r[0], tipo: r[1], estado: r[2], desde: r[3], hasta: r[4], autor: r[5],\n        badgeStyle: `display:inline-flex;align-items:center;padding:3px 10px;border-radius:9999px;font-size:12.5px;font-weight:600;background:${b.bg};color:${b.fg};`,\n      };\n    });\n\n    return {\n      accent, accentSoft, showLabels, nav, destinoList, activeDestino, rows,\n      user: { name: 'María Sánchez', role: 'Administradora', initials: 'MS' },\n      destinoOpen: this.state.destinoOpen, userOpen: this.state.userOpen,\n      anyMenuOpen: this.state.destinoOpen || this.state.userOpen,\n      toggleDestino: this.toggleDestino, toggleUser: this.toggleUser, closeMenus: this.closeMenus,\n    };\n  }\n}\n<\u002Fscript>\n\n\n<\u002Fbody><\u002Fhtml>"
