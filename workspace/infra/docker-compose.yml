version: '3.8'

services:

  api-gateway:
    build:
      context: ../gateways/api-gateway
      dockerfile: Dockerfile
    environment:
      - PORT=8080
      - JWT_SECRET=change-me-in-production
    networks:
      - auto-insight-net


  users-service:
    build:
      context: ../services/users-service
      dockerfile: Dockerfile
    environment:
      - PORT=8081
      - DB_URL=postgres://postgres:postgres@postgres:5432/postgres?sslmode=disable&search_path=users_service
      - RABBIT_URL=amqp://guest:guest@rabbitmq:5672/
      
      - OTEL_EXPORTER_OTLP_ENDPOINT=otel-collector:4317
      - OTEL_SERVICE_NAME=users-service
      
      # Email (Resend) — set RESEND_API_KEY for real delivery
      - RESEND_API_KEY=${RESEND_API_KEY:-}
      - RESEND_FROM=${RESEND_FROM:-onboarding@resend.dev}
      - FRONTEND_URL=${FRONTEND_URL:-http://localhost:3000}
      - LOGO_URL=${LOGO_URL:-}
      - EMAIL_TEMPLATES_DIR=/app/email-templates
      
    volumes:
      - ./email-templates:/app/email-templates
      
    depends_on:
      postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      
    healthcheck:
      test: ["CMD", "wget", "--spider", "-q", "http://localhost:8081/health"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 10s
    networks:
      - auto-insight-net


  rabbitmq:
    image: rabbitmq:3.12-management
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "check_port_connectivity"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 15s
    networks:
      - auto-insight-net


  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      LANG: en_US.utf8
      LC_ALL: en_US.utf8
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./init_generated.sql:/docker-entrypoint-initdb.d/init_generated.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres"]
      interval: 5s
      timeout: 5s
      retries: 5
    networks:
      - auto-insight-net


  jaeger:
    image: jaegertracing/all-in-one:latest
    networks:
      - auto-insight-net

  minio:
    image: quay.io/minio/minio:latest
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: minioadmin
      MINIO_ROOT_PASSWORD: minioadmin
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s
    networks:
      - auto-insight-net

  minio-init:
    image: quay.io/minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
      sleep 3;
      /usr/bin/mc alias set myminio http://minio:9000 minioadmin minioadmin;
      /usr/bin/mc mb myminio/auto-insight-evidence --ignore-existing;
      /usr/bin/mc anonymous set private myminio/auto-insight-evidence;
      echo 'Bucket auto-insight-evidence created and set to private';
      "
    networks:
      - auto-insight-net

  prometheus:
    image: prom/prometheus:latest
    networks:
      - auto-insight-net

  otel-collector:
    image: otel/opentelemetry-collector:latest
    command: ["--config=/etc/otel-collector-config.yml"]
    volumes:
      - ./otel-collector-config.yml:/etc/otel-collector-config.yml
    depends_on:
      - jaeger
    networks:
      - auto-insight-net


  # ============================================================================
  # Frontend — Next.js (BFF pattern)
  # ============================================================================
  frontend:
    image: ghcr.io/my-org/my-app/frontend
    build:
      context: ../frontend
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      # BFF proxy: Next.js API routes forward to the api-gateway
      - INTERNAL_GATEWAY_URL=http://api-gateway:8080
      # MinIO / S3 — internal Docker network
      - MINIO_ENDPOINT=http://minio:9000
      - MINIO_ACCESS_KEY=minioadmin
      - MINIO_SECRET_KEY=minioadmin
      - MINIO_BUCKET=auto-insight-evidence
    depends_on:
      api-gateway:
        condition: service_started
    networks:
      - auto-insight-net


  # ============================================================================
  # Nginx — Reverse proxy (port 80)
  # ============================================================================
  # Serves the frontend + API on port 80 so ngrok works out of the box.
  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - frontend
    networks:
      - auto-insight-net


volumes:
  postgres_data:
  minio_data:

networks:
  auto-insight-net:
    driver: bridge
