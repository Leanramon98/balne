# =============================================================================
# auto-insight — Nginx Reverse Proxy
# =============================================================================
# Routes ALL traffic to the Next.js frontend (BFF pattern).
# The frontend handles UI routes AND proxies /api/* to the api-gateway.
# =============================================================================

# Only set Connection: upgrade for actual WebSocket requests
map $http_upgrade $connection_upgrade {
    default  "upgrade";
    ""       "";
}

upstream frontend {
    server frontend:3000;
}

server {
    listen 80;
    server_name localhost;

    # Allow large uploads (evidence files, etc.)
    client_max_body_size 50M;

    # ------------------------------------------------------------------
    # Frontend — Next.js (UI + BFF API proxy)
    # ------------------------------------------------------------------
    # Catches everything: page routes, Next.js internals, and /api/* calls.
    location / {
        proxy_pass http://frontend;
        proxy_http_version 1.1;

        # WebSocket support (used by Next.js for HMR in dev, safe to keep in prod)
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # Standard proxy headers
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Timeouts for long-running requests (uploads, heavy reports)
        proxy_read_timeout 120s;
        proxy_send_timeout 120s;

        proxy_cache_bypass $http_upgrade;
    }
}
