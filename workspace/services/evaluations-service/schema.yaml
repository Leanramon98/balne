name: evaluations-service
module_path: evaluations-service

uses: [Destination]

# Custom DTOs and domain entities for the DTI Evaluation System
entities:
  # ── Request/Response DTOs ──────────────────────────────────────────
  - name: HealthResponse
    fields:
      - name: Status
        type: string

  - name: RootResponse
    fields:
      - name: Message
        type: string

  # ── Domain Entities ────────────────────────────────────────────────
  - name: SubnationalLevel
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Country
        type: string
      - name: Name
        type: string

  - name: DestinationTypology
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Name
        type: string

  - name: PopulationRange
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Name
        type: string

  - name: Region
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Name
        type: string
      - name: Description
        type: string

  - name: MemberType
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Name
        type: string

  - name: ResponsibleArea
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Name
        type: string
      - name: Description
        type: string

  - name: AxisLevel
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Axis
        type: string
        unique: true
      - name: ObjectivePercent
        type: decimal
      - name: SortOrder
        type: int

  - name: Scope
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: Axis
        type: string
      - name: Acronym
        type: string
      - name: Name
        type: string
      - name: Description
        type: string
      - name: Icon
        type: string
      - name: SortOrder
        type: int

  - name: Requirement
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: ScopeID
        type: uuid
      - name: Code
        type: string
        unique: true
      - name: Name
        type: string
      - name: Description
        type: string

  - name: Indicator
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: RequirementID
        type: uuid
      - name: Code
        type: string
        unique: true
      - name: Name
        type: string
      - name: Description
        type: string
      - name: Type
        type: string
      - name: Criteria
        type: json
      - name: CreatedAt
        type: timestamp
      - name: UpdatedAt
        type: timestamp

  - name: Evaluation
    fields:
      - name: ID
        type: uuid
        primary: true
      - name: DestinationID
        type: uuid
      - name: Name
        type: string
      - name: Type
        type: string
      - name: Status
        type: string
      - name: StartDate
        type: date
        nullable: true
      - name: EndDate
        type: date
        nullable: true
      - name: HasExternalEvaluator
        type: boolean
        default: false
      - name: PromotedFromID
        type: uuid
        nullable: true
      - name: CreatedBy
        type: uuid
      - name: CreatedAt
        type: timestamp
      - name: UpdatedAt
        type: timestamp

# ── Phase 1a Endpoints ───────────────────────────────────────────────
endpoints:
  # Health
  - method: GET
    path: /health
    response_entity: HealthResponse
    public: true

  # ── Admin Catalogs CRUD ──────────────────────────────────────────
  # SubnationalLevels
  - method: GET
    path: /admin/subnational-levels
    response_entity: SubnationalLevel
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/subnational-levels
    request_entity: SubnationalLevel
    response_entity: SubnationalLevel
    roles: [admin]

  - method: GET
    path: /admin/subnational-levels/{id}
    response_entity: SubnationalLevel
    roles: [admin]

  - method: PUT
    path: /admin/subnational-levels/{id}
    request_entity: SubnationalLevel
    response_entity: SubnationalLevel
    roles: [admin]

  - method: DELETE
    path: /admin/subnational-levels/{id}
    roles: [admin]

  # DestinationTypologies
  - method: GET
    path: /admin/typologies
    response_entity: DestinationTypology
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/typologies
    request_entity: DestinationTypology
    response_entity: DestinationTypology
    roles: [admin]

  - method: GET
    path: /admin/typologies/{id}
    response_entity: DestinationTypology
    roles: [admin]

  - method: PUT
    path: /admin/typologies/{id}
    request_entity: DestinationTypology
    response_entity: DestinationTypology
    roles: [admin]

  - method: DELETE
    path: /admin/typologies/{id}
    roles: [admin]

  # PopulationRanges
  - method: GET
    path: /admin/population-ranges
    response_entity: PopulationRange
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/population-ranges
    request_entity: PopulationRange
    response_entity: PopulationRange
    roles: [admin]

  - method: GET
    path: /admin/population-ranges/{id}
    response_entity: PopulationRange
    roles: [admin]

  - method: PUT
    path: /admin/population-ranges/{id}
    request_entity: PopulationRange
    response_entity: PopulationRange
    roles: [admin]

  - method: DELETE
    path: /admin/population-ranges/{id}
    roles: [admin]

  # Regions
  - method: GET
    path: /admin/regions
    response_entity: Region
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/regions
    request_entity: Region
    response_entity: Region
    roles: [admin]

  - method: GET
    path: /admin/regions/{id}
    response_entity: Region
    roles: [admin]

  - method: PUT
    path: /admin/regions/{id}
    request_entity: Region
    response_entity: Region
    roles: [admin]

  - method: DELETE
    path: /admin/regions/{id}
    roles: [admin]

  # MemberTypes
  - method: GET
    path: /admin/member-types
    response_entity: MemberType
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/member-types
    request_entity: MemberType
    response_entity: MemberType
    roles: [admin]

  - method: GET
    path: /admin/member-types/{id}
    response_entity: MemberType
    roles: [admin]

  - method: PUT
    path: /admin/member-types/{id}
    request_entity: MemberType
    response_entity: MemberType
    roles: [admin]

  - method: DELETE
    path: /admin/member-types/{id}
    roles: [admin]

  # ResponsibleAreas
  - method: GET
    path: /admin/responsible-areas
    response_entity: ResponsibleArea
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/responsible-areas
    request_entity: ResponsibleArea
    response_entity: ResponsibleArea
    roles: [admin]

  - method: GET
    path: /admin/responsible-areas/{id}
    response_entity: ResponsibleArea
    roles: [admin]

  - method: PUT
    path: /admin/responsible-areas/{id}
    request_entity: ResponsibleArea
    response_entity: ResponsibleArea
    roles: [admin]

  - method: DELETE
    path: /admin/responsible-areas/{id}
    roles: [admin]

  # AxisLevels
  - method: GET
    path: /admin/axes
    response_entity: AxisLevel
    response_is_list: true
    roles: [admin]

  - method: POST
    path: /admin/axes
    request_entity: AxisLevel
    response_entity: AxisLevel
    roles: [admin]

  - method: GET
    path: /admin/axes/{id}
    response_entity: AxisLevel
    roles: [admin]

  - method: PUT
    path: /admin/axes/{id}
    request_entity: AxisLevel
    response_entity: AxisLevel
    roles: [admin]

  - method: DELETE
    path: /admin/axes/{id}
    roles: [admin]

  # ── Scopes & Requirements (Read-only) ────────────────────────────
  - method: GET
    path: /scopes
    response_entity: Scope
    response_is_list: true
    roles: [admin, admin_destino, gestor_destino, consultor, auditor, gestor_regional, gestor_nacional]

  - method: GET
    path: /requirements
    response_entity: Requirement
    response_is_list: true
    roles: [admin, admin_destino, gestor_destino, consultor, auditor, gestor_regional, gestor_nacional]

  # ── Indicators (read-only listing) ────────────────────────────────
  - method: GET
    path: /indicators
    response_entity: Indicator
    response_is_list: true
    roles: [admin, admin_destino, gestor_destino, consultor, auditor, gestor_regional, gestor_nacional]

events: []

rbac:
  roles:
    - name: admin
      description: Super admin — full access
    - name: admin_destino
      description: Destination admin
    - name: gestor_destino
      description: Destination manager
    - name: consultor
      description: External consultant
    - name: auditor
      description: External auditor
    - name: gestor_regional
      description: Regional manager
    - name: gestor_nacional
      description: National manager
